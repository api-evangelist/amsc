name: AMSC
description: American Superconductor Corporation (AMSC) is a power control systems company headquartered
  in Ayer, Massachusetts, and traded publicly on NASDAQ under the ticker AMSC. The company designs and
  delivers grid and power-electronics solutions across three specialties - power supply, power protection,
  and power innovation - serving the energy, renewables, utility, industrial, materials, and military
  sectors. Its offerings span grid capacity and resiliency systems, renewable generation integration,
  industrial process power control, and shipboard power protection for naval defense. AMSC is an early
  Battery Ventures portfolio investment. AMSC does not currently publish a public developer API, SDK,
  or developer portal; this profile captures the company's corporate identity and domain security posture
  within the API Evangelist network.
